[project]
name = "yolo"
version = "0.1.0"
description = "YOLO object detection from webcam"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "torch==1.13.1",
    "torchvision==0.14.1",
    "numpy<2",
]

[project.scripts]
yolo-webcam = "main:main"
